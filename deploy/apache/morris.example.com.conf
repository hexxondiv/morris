# Enable required modules once:
# a2enmod proxy proxy_http headers rewrite ssl

<VirtualHost *:80>
    ServerName morrismonye.com
    ServerAlias www.morrismonye.com

    RewriteEngine On
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName morrismonye.com
    ServerAlias www.morrismonye.com

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/morrismonye.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/morrismonye.com/privkey.pem

    ProxyPreserveHost On
    ProxyRequests Off

    # Forward protocol/host for Auth.js and absolute URL correctness.
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"
    RequestHeader set X-Forwarded-Host "%{HTTP_HOST}s"

    ProxyPass / http://127.0.0.1:3000/ retry=0 timeout=60 keepalive=On
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog ${APACHE_LOG_DIR}/morris-error.log
    CustomLog ${APACHE_LOG_DIR}/morris-access.log combined
</VirtualHost>
</IfModule>
